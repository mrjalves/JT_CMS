name: Build e Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # Só necessário se o build dos estilos Tailwind/SCSS não rodar no dotnet build
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version: 20

      - name: Restore
        run: dotnet restore src/JT_CMS

      - name: Publish
        run: >
          dotnet publish src/JT_CMS
          -c Release
          -o ./publish
          --no-restore
          -p:ErrorOnDuplicatePublishOutputFiles=false

      
      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_PORT: ${{ secrets.VPS_PORT }}
        run: |
          echo "HOST: ${#SSH_HOST} caracteres | PORT: '${SSH_PORT}' | KEY: ${#SSH_KEY} caracteres"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null && echo "Chave privada válida"
          ssh-keyscan -v -T 10 -p "$SSH_PORT" -H "$SSH_HOST" 2>&1 | tee -a ~/.ssh/known_hosts | head -20
          test -s ~/.ssh/known_hosts || { echo "::error::Não consegui conectar na VPS"; exit 1; }

      - name: Enviar arquivos para a VPS
        run: |
          rsync -az --delete \
            --exclude 'appsettings.json' \
            --exclude 'appsettings.Production.json' \
            --exclude 'Data/' \
            --exclude 'uploads/' \
            --exclude '*.db' \
            -e "ssh -p ${{ secrets.VPS_PORT }}" \
            ./publish/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PATH }}/

      - name: Reiniciar serviço
        run: |
          ssh -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "sudo systemctl restart jtcms"